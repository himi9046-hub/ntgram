name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  gateway:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - name: build
        run: |
          mkdir -p ../dist
          for t in linux/amd64 linux/arm64 linux/arm windows/amd64; do
            os=${t%/*} arch=${t#*/} ext=
            [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags=-s -o ../dist/ntgram-gateway-$os-$arch$ext .
          done
      - uses: actions/upload-artifact@v7
        with:
          name: gateway
          path: dist/

  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686
      - run: make -C client
      - name: no imports newer than NT 4.0
        run: |
          i686-w64-mingw32-objdump -p client/ntgram.exe | grep 'DLL Name' | tee dlls
          ! grep -viE 'KERNEL32|USER32|GDI32|WSOCK32|msvcrt' dlls
      - uses: actions/upload-artifact@v7
        with:
          name: client
          path: client/ntgram.exe

  release:
    needs: [gateway, client]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
